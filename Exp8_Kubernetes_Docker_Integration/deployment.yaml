apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-k8s-app
  template:
    metadata:
      labels:
        app: docker-k8s-app
    spec:
      containers:
        - name: app
          image: shaikazima28/exp8-app:1.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: docker-k8s-service
spec:
  type: NodePort
  selector:
    app: docker-k8s-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
